appId: com.quantastudio.app
productName: Quanta Studio
copyright: Copyright © 2026 Quanta Studio contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack: []
fileAssociations:
  - ext: quanta
    name: Quanta Studio Project
    role: Editor
  - ext: pzfx
    name: Prism XML Project
    role: Viewer
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Science
  icon: build/icon.png
  maintainer: Quanta Studio contributors
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: build/icon.png
  hardenedRuntime: false
  identity: null
publish:
  provider: github
  owner: KakiroX
  repo: Winners2
